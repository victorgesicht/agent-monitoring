[server]
http_port = 9999
http_addr = 127.0.0.1
root_url = http://127.0.0.1:9999

[paths]
provisioning = ${OC_DASHBOARD_DIR}/grafana/provisioning
data = ${OC_DASHBOARD_DIR}/grafana/data
logs = ${OC_DASHBOARD_DIR}/grafana/logs
plugins = ${OC_DASHBOARD_DIR}/grafana/plugins

[security]
# default Grafana credentials (admin/admin); anonymous viewer enabled below

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer